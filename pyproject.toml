[project]
name = "skilleval"
version = "0.2.0"
description = "Agent Skill 消融评测框架 —— 量化每个 skill/MCP/规则对成功率与成本的边际贡献"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
report = ["matplotlib"]
dev = ["pytest>=9.2.0", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.10"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]

[tool.ruff.lint.per-file-ignores]
"demo/**" = ["E402"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
